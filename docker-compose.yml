services:
  marreta:
    container_name: marreta
    image: ghcr.io/manualdousuario/marreta:latest
    ports:
      - "80:80"
    volumes:
      - ./cache:/cache
      - ./database:/database
    environment:
      - APP_NAME=${APP_NAME:-Marreta}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_LOCALE=${APP_LOCALE:-pt-br}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Chapéu de paywall é marreta!}
      - DNS_SERVERS=${DNS_SERVERS:-1.1.1.1,8.8.8.8}
      - BROWSER_WS_ENDPOINT=${BROWSER_WS_ENDPOINT:-ws://marreta_browser:9222}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS:-30000}
      - CACHE_DIR=${CACHE_DIR:-/cache}
      - DB_DATABASE=${DB_DATABASE:-/database/database.sqlite}
      - DISABLE_CACHE=${DISABLE_CACHE:-false}
      - CLEANUP_DAYS=${CLEANUP_DAYS:-7}
      - PROXY_URL=${PROXY_URL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@marreta.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    depends_on:
      - browser
    restart: unless-stopped

  marreta_browser:
    container_name: marreta_browser
    image: lightpanda/browser:nightly
    command: ["serve", "--host", "0.0.0.0", "--port", "9222"]
    ports:
      - "9222:9222"
    restart: unless-stopped
