services:
  marreta:
    container_name: marreta
    build: .
    ports:
      - "80:80"
    volumes:
      - ./storage/app/marreta-cache:/var/www/html/storage/app/marreta-cache
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
    environment:
      - APP_NAME=${APP_NAME:-Marreta}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_LOCALE=${APP_LOCALE:-pt-br}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Chapéu de paywall é marreta!}
      - DNS_SERVERS=${DNS_SERVERS:-1.1.1.1,8.8.8.8}
      - BROWSER_WS_ENDPOINT=${BROWSER_WS_ENDPOINT:-ws://browser:9222}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS:-30000}
      - DISABLE_CACHE=${DISABLE_CACHE:-false}
      - CLEANUP_DAYS=${CLEANUP_DAYS:-7}
      - PROXY_URL=${PROXY_URL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@marreta.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    depends_on:
      - browser
    restart: unless-stopped

  browser:
    container_name: marreta-browser
    image: ghcr.io/browserless/chromium:v2.7.0
    ports:
      - "9222:3000"
    environment:
      - TIMEOUT=30000
      - MAX_CONCURRENT_SESSIONS=10
    restart: unless-stopped
