name: ✅ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  php-lint:
    name: 🔍 PHP syntax check
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐘 Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none

      - name: 🔍 Validate PHP syntax
        run: git ls-files | grep '\.php$' | xargs -P4 -I{} php -l {}

  tests:
    name: 🧪 Run tests
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐘 Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, sockets, sqlite3, pdo_sqlite
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🛡️ Audit dependencies
        run: composer audit

      - name: 🎨 Check code style
        run: vendor/bin/pint --test

      - name: 🧰 Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Run test suite
        run: php artisan test
